# ====================================================================
# TRIDENT SECURITY SERVICES - HIGH-PERFORMANCE NGINX LOAD BALANCER CONFIG
# Engineered for 100,000+ requests/minute & Enterprise SSL/TLS Hardening
# ====================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip & Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=form_submission:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream Node.js Cluster Backend Pool
    upstream trident_backend_cluster {
        least_conn; # Load balance to worker with least active connections
        server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s backup;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s backup;
        keepalive 64;
    }

    # Upstream Frontend Static / SSR Pool
    upstream trident_frontend {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    # 1. HTTP to HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name tridentsecuritys.com www.tridentsecuritys.com;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Production Gateway
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tridentsecuritys.com www.tridentsecuritys.com;

        # SSL Certificates (Let's Encrypt / Cloudflare SSL)
        ssl_certificate /etc/letsencrypt/live/tridentsecuritys.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tridentsecuritys.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/tridentsecuritys.com/chain.pem;

        # SSL Security Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Enterprise Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Max body limit (Prevents payload flood attacks)
        client_max_body_size 10M;

        # API Routes Proxy
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_conn addr 50;

            proxy_pass http://trident_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Form submission strict rate limit
        location ~ ^/api/(inquiries|quotes|careers) {
            limit_req zone=form_submission burst=5 nodelay;
            proxy_pass http://trident_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Static Asset Caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/trident-client/dist;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Frontend SPA Fallback
        location / {
            root /var/www/trident-client/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
